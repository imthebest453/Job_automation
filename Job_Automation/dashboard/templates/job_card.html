<div class="job-card">

    <h3>
        {{ job.title }}
    </h3>


    <p>
        🏢 {{ job.company }}
    </p>


    <p>
        📍 {{ job.location }}
    </p>


    <div class="match">
        Match: {{ job.match_score | default(0) }}%
    </div>


    <button>
        View Job
    </button>


    <button>
        Track
    </button>


</div>
