<!DOCTYPE html>
<html>
<head>
    <title>Job Automation</title>
     <link rel="stylesheet" href="/static/style.css">
</head>

<body>

<h1>Job Automation Dashboard</h1>

<form method="POST" action="/search">
    <input type="text" name="keyword" placeholder="Search job roles..." required>
    <button type="submit">Search</button>
</form>

{% if keyword %}
    <p>Search results for "<strong>{{ keyword }}</strong>"</p>
{% endif %}

<hr>

{% if jobs %}
    {% for job in jobs %}

    <h3>{{ job.title }}</h3>

    <p>{{ job.company }}</p>

    <p>{{ job.location }}</p>

    <p>{{ job.salary }}</p>

    <a href="{{ job.url }}">Open Job</a>

    <hr>

    {% endfor %}
{% else %}
    <p>No jobs found.</p>
{% endif %}

</body>
</html>
