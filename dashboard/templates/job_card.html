<div class="job-card">

    <h3>{{ job.title }}</h3>

    <p>🏢 {{ job.company }}</p>

    <p>📍 {{ job.location }}</p>

    {% if job.salary %}
        <p>💰 {{ job.salary }}</p>
    {% endif %}

    {% if job.description %}
        <p>{{ job.description }}</p>
    {% endif %}

    <div class="job-actions">

        <a href="{{ job.url }}"
           target="_blank"
           class="button">
            View Job
        </a>

        <a href="/apply/{{ job.id }}"
           class="button apply-button">
            🚀 Apply
        </a>

    </div>

</div>
