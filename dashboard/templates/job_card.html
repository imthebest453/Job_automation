<div class="job-card">


<h3>
{{ job.title }}
</h3>


<p>
🏢 {{ job.company }}
</p>


<p>
📍 {{ job.location }}
</p>


<p>
💰 {{ job.salary }}
</p>


<div class="match">

Match:
{{ job.match_score | default(0) }}%

</div>



<a 
href="{{ job.url }}"
target="_blank"
class="button"
>

View Job

</a>



<button class="button secondary">

Track

</button>


</div>
