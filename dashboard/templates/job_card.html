<div class="job-card">


<div class="job-header">

<h3>
{{ job.title }}
</h3>


<span>
{{ job.source }}
</span>


</div>



<p>
🏢 {{ job.company }}
</p>



<p>
📍 {{ job.location }}
</p>



<p>
💰 {{ job.salary }}
</p>



<p class="description">

{{ job.description }}

</p>




<div class="actions">


<a 
href="{{ job.url }}"
target="_blank"
class="primary-btn">

View Job

</a>


<button class="secondary-btn">

Track

</button>


</div>


</div>
