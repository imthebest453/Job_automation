<div class="job-card">


<h3 class="job-title">
{{ job.title }}
</h3>

<p class="job-company">
🏢 {{ job.company }}
</p>

<p class="job-location">
📍 {{ job.location }}
</p>

{% if job.salary %}
<p class="job-salary">
💰 {{ job.salary }}
</p>
{% endif %}

{% if job.description %}
<p class="job-description">
{{ job.description }}
</p>
{% endif %}



<div class="job-actions">


<a
href="{{ job.url }}"
target="_blank"
class="button view-button">
👁️ View Job
</a>

<form method="POST" action="/apply/{{ job.id }}" style="display:inline;">
  <button type="submit" class="button apply-btn">
    📝 Prepare Application
  </button>
</form>


</div>
</div>
